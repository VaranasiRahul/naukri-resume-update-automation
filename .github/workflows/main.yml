name: Naukri Resume Auto-Update

on:
  schedule:
    # Slot 1: 9:00 AM IST = 03:30 UTC
    - cron: '30 3 * * 1-6'
    # Slot 2: 2:00 PM IST = 08:30 UTC
    - cron: '30 8 * * 1-6'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  update-naukri:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Naukri updater
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_MOBILE:   ${{ secrets.NAUKRI_MOBILE }}
          GITHUB_ACTIONS:  "true"
        run: |
          python naukri.py --no-delay
